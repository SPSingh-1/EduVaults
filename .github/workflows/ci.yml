name: "EduVault CI / Build & Test Suite"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: .NET API & Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x
          9.0.x

    - name: Restore dependencies
      run: dotnet restore EduVault.slnx

    - name: Build solution
      run: dotnet build EduVault.slnx -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test EduVault.slnx -c Release --no-build --verbosity normal

  frontend-build:
    name: React Web Frontend Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Frontend Dependencies
      run: cd src/EduVault.Web && npm ci || npm install

    - name: Build Frontend Bundle
      run: cd src/EduVault.Web && npm run build
